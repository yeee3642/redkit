[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redkit"
version = "0.1.0"
description = "Portable, offline, no-AI red team toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "redkit" }]
keywords = ["red-team", "pentest", "ctf", "security", "offline"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# All optional. redkit runs on pure stdlib; these enrich specific modules.
extra = [
    "paramiko>=2.7",   # native SSH for credential spraying
    "requests>=2.25",  # richer HTTP handling in web modules
]

[project.scripts]
redkit = "redkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["redkit*"]

[tool.setuptools.package-data]
redkit = ["data/wordlists/*.txt", "data/creds/*.txt", "data/creds/*.json"]
